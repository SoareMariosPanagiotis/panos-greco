services:
  db:
    image: postgres:17
    container_name: panos-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432" # doar de pe calculatorul tău, nu și din rețea
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    image: graphile/postgraphile:4
    container_name: panos-api
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "127.0.0.1:5050:5000" # la fel: API-ul îl folosește doar site-ul (5000 îl iau uneori alte programe)
    command:
      - --connection
      - postgres://panos_api:${POSTGRES_API_PASSWORD}@db:5432/${POSTGRES_DB}
      - --owner-connection
      - postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - --default-role
      - panos_anonymous
      - --jwt-secret
      - ${JWT_SECRET}
      - --jwt-token-identifier
      - auth.jwt_token
      - --schema
      - auth,catalog,sales
      - --watch
      - --enhance-graphiql

  # Oficiul poștal de test: prinde toate mailurile și le arată pe http://localhost:8025
  mail:
    image: axllent/mailpit
    container_name: panos-mail
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025" # pagina web în care vezi mailurile
      - "127.0.0.1:1025:1025" # SMTP: pe aici programele „predau” mailurile

  # Poștașul: trimite singur mailurile din coadă (codul e în folderul mailer)
  mailer:
    image: node:22-alpine
    container_name: panos-mailer
    restart: unless-stopped
    init: true # se oprește imediat la docker compose stop
    depends_on:
      - db
      - mail
    working_dir: /app
    volumes:
      - ./mailer:/app
    command: sh -c "npm install --no-audit --no-fund && exec node index.mjs"
    environment:
      DATABASE_URL: postgres://panos_mailer:${POSTGRES_MAILER_PASSWORD}@db:5432/${POSTGRES_DB}
      SMTP_HOST: mail
      SMTP_PORT: "1025"
      MAIL_FROM: "Panos Greco <office@panos-greco.com>"
      SHOP_EMAIL: office@panos-greco.com
      SITE_URL: http://localhost:3000

volumes:
  pgdata: