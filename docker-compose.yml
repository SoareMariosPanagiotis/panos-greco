services:
  db:
    image: postgres:17
    container_name: panos-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    image: graphile/postgraphile:4
    container_name: panos-api
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "5000:5000"
    command:
      - --connection
      - postgres://panos_api:${POSTGRES_API_PASSWORD}@db:5432/${POSTGRES_DB}
      - --owner-connection
      - postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - --default-role
      - panos_anonymous
      - --jwt-secret
      - ${JWT_SECRET}
      - --jwt-token-identifier
      - auth.jwt_token
      - --schema
      - auth,catalog
      - --watch
      - --enhance-graphiql

volumes:
  pgdata: